{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zuveriya Khan - Data Analyst, aspiring AI professional, and UI/UX designer.">
  <title>{% block title %}Zuveriya Khan | Data, Design & AI{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'images/Image.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
  <script defer src="{% static 'js/portfolio.js' %}"></script>
</head>
<body class="bg-sage text-ink">
  {% include "partials/navbar.html" %}
  {% if messages %}<div class="message-stack" aria-live="polite">{% for message in messages %}<p class="message message-{{ message.tags }}">{{ message }}</p>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
  {% include "partials/footer.html" %}
</body>
</html>
